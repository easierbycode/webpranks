name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Run the JavaScript-based actions (checkout, setup-node, deploy-pages, …) on
# Node 24, which becomes the runner default after 2026-06-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (LTS) runs the build. Vite 5.4 does not build correctly on
          # Node 24 (it emits a partial bundle with no index.html); the JS-based
          # *actions* still run on Node 24 via FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
          # above. Bump this to 24 only after upgrading Vite to v6+.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # Project site lives at easierbycode.com/webpranks, so assets must be
        # served from the /webpranks/ subpath.
        run: pnpm build
        env:
          VITE_BASE: /webpranks/

      - name: Add SPA fallback
        # GitHub Pages has no redirect rules, so serve index.html for unknown
        # client-side routes (deep links / refresh on /webpranks/about etc.).
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
